[project]
name = "agent-rag"
version = "0.3.0"
description = "AgentRAG — 自驱式 RAG 框架，Agent 自主决策检索策略、自纠错，告别被动管道式 RAG"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
keywords = ["rag", "agent", "react", "llm", "retrieval", "milvus", "hybrid-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/user/agent-rag"
Documentation = "https://github.com/user/agent-rag#readme"
Repository = "https://github.com/user/agent-rag"

[project.scripts]
agent-rag = "cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require Milvus)",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src", "rag"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
